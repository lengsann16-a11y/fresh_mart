{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1><i class="fas fa-trash-alt"></i> Delete Product</h1>
    </div>
</section>

<section class="checkout-section">
    <div class="container">
        <div class="empty-state" style="max-width: 500px;">
            <div class="empty-icon">⚠️</div>
            <h2>Are you sure?</h2>
            <p>You are about to delete <strong>{{ product.name }}</strong>. This action cannot be undone.</p>
            
            <form method="post" style="width: 100%;">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-center" style="justify-content: center;">
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="fas fa-trash"></i> Yes, Delete
                    </button>
                    <a href="{% url 'store:product_detail' product.id product.slug %}" class="btn btn-outline btn-lg">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
